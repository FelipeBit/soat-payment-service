apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: payment
type: Opaque
stringData:
  mongodb-uri: ${MONGODB_URI:-mongodb://localhost:27017/payment_db}
  mercado-pago-access-token: ${MERCADO_PAGO_ACCESS_TOKEN:-test-token}
  order-service-url: ${ORDER_SERVICE_URL:-http://order-service.order.svc.cluster.local:3001}

